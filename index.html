<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>Акт по квартире</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1b2430;--muted:#6b7686;--line:#d9dee6;--acc:#1f4e79;--acc2:#e8f0fa;--ok:#1d7a3e;--bad:#b42318;--warn:#fff4d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,Roboto,"Segoe UI",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 11px;font-size:14px}
main{padding:12px 12px 110px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sum{margin-left:auto;font-weight:500;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 12px;font-size:15px;color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;background:var(--acc);color:#fff}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.ghost{background:transparent;color:var(--acc);border:1px dashed var(--acc)}
.btn.small{display:inline-block;width:auto;padding:8px 12px;font-size:14px}
.del{border:0;background:transparent;color:var(--bad);font-size:14px;padding:6px}
.win,.ritem{border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 10px}
.win-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.okn{width:84px}
.stepper{display:flex;align-items:center;gap:6px;margin-left:auto}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px}
.stepper span{min-width:44px;text-align:center;font-weight:600}
.panes{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
.pane{border:2px solid #8a96a8;border-radius:8px;background:#eef4fb;padding:6px;text-align:center}
.pane .n{font-size:12px;color:var(--muted);text-align:left}
.pane .mk{font-size:30px;font-weight:700;height:40px;line-height:40px;cursor:pointer;user-select:none}
.pane.m-plus{background:#e3f4e8;border-color:var(--ok)}.pane.m-minus{background:#fde8e6;border-color:var(--bad)}
.pane.m-both{background:#fff1d6;border-color:#b7791f}.pane.m-x{background:#eceff3;border-color:#555}
.pane input{padding:6px;text-align:center;font-size:15px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.ritem .t{font-weight:600}.ritem .k{font-size:12.5px;color:var(--muted)}
.ritem .row{margin-top:8px;align-items:flex-end}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.ph .th{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;background:#ddd}
.ph .th img{width:100%;height:100%;object-fit:cover}
.ph .th b{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;text-align:center;padding:1px 0}
.ph .pb{border:1px dashed var(--acc);color:var(--acc);background:#fff;border-radius:8px;height:40px;padding:0 10px;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}.it .m{flex:1}.it .s{font-size:13px;color:var(--muted)}
.day{display:flex;align-items:center;gap:8px;margin:4px 0 2px}.day b{flex:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end}
.sheet .p{background:#fff;width:100%;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:4px 0 10px;font-size:17px}
.prev img{width:100%;border:1px solid var(--line);border-radius:8px;margin:0 0 10px;background:#fff}
.warn{background:var(--warn);border-radius:10px;padding:8px 10px;font-size:14px;margin:0 0 10px}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
table.imp{width:100%;border-collapse:collapse;font-size:13px}table.imp td,table.imp th{border:1px solid var(--line);padding:4px}
</style>
</head>
<body>
<header><h1 id="ttl">Акты по квартирам</h1><button id="hdrBtn">Меню</button></header>
<main id="app"></main>
<div class="bar"><div class="in" id="barIn"></div></div>
<input type="file" id="fileIn" accept="image/*" multiple style="display:none">
<script>
'use strict';
/* ===== справочник ===== */
const KINDS=[
 {code:3,short:'ЛКП',items:['Отопительный прибор','Входная дверь','Коробка входной двери','Наличник входной двери','Петли входной двери','Ручка входной двери','Накладка замка входной двери','Раздвижная система','Отлив','Ограждение балкона (лоджии)','Алюминиевый витраж','Дверь кладовой','Почтовый ящик','Прочие металлоконструкции']},
 {code:1,short:'ПВХ',items:['Оконная рама','Створка','Импост','Штапик','Балконная дверь','Порог балконной двери','Витраж','Входная группа','Подоконник','Откос','Нащельник']},
 {code:2,short:'Плёнка',items:['Оконная рама','Створка','Импост','Штапик','Балконная дверь','Витраж','Входная группа']},
 {code:4,short:'МДФ',items:['Панель МДФ входной двери','Наличник входной двери','Добор входной двери']},
 {code:5,short:'Плитка',items:['Плитка пола','Плитка стен','Фасадная плита']},
 {code:6,short:'Регулировка',items:['Створка окна','Створка балконной двери'],unit:'Створок'}
];
const ABBR={'Отопительный прибор':'ОП'};
const WTYPES=['ОК','Балконная дверь','Витраж','Входная группа','Лоджия'];
const MARKS=['','+','−','±','×'], MCLS={'+':'m-plus','−':'m-minus','±':'m-both','×':'m-x'};

/* ===== хранение ===== */
const KEY='akt-kv-v1', CKEY='akt-cfg';
let DB={settings:{me:[],object:''},acts:[]};
try{const s=localStorage.getItem(KEY); if(s){const d=JSON.parse(s); DB=Object.assign(DB,d)}}catch(e){}
if(!Array.isArray(DB.settings.me))DB.settings.me=[];
const toArr=v=>Array.isArray(v)?v:String(v||'').split(',').map(x=>x.trim()).filter(Boolean);
DB.acts.forEach(a=>{a.workers=toArr(a.workers);a.windows.forEach(w=>w.photos=w.photos||[]);a.rest.forEach(r=>r.photos=r.photos||[])});
let CFG={objects:[],workers:[]};
try{const s=localStorage.getItem(CKEY); if(s) CFG=Object.assign(CFG,JSON.parse(s))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Память телефона заполнена — удалите старые акты')}}
/* ===== связь с офисом (Google) ===== */
let ENDPOINT='',KEYV='';
try{KEYV=localStorage.getItem('akt-key')||'';ENDPOINT=localStorage.getItem('akt-ep')||''}catch(e){}
(function(){const m=location.hash.match(/k=([\w-]+)/);if(m){KEYV=m[1];try{localStorage.setItem('akt-key',KEYV)}catch(e){}history.replaceState(null,'',location.pathname)}})();
async function loadCfg(){
  try{const r=await fetch('config.json?'+Date.now(),{cache:'no-store'});if(r.ok){const c=await r.json();if(c.endpoint){ENDPOINT=c.endpoint;try{localStorage.setItem('akt-ep',ENDPOINT)}catch(e){}}else if(c.objects)CFG=Object.assign({objects:[],workers:[]},c)}}catch(e){}
  if(ENDPOINT&&KEYV){try{const c=await (await fetch(ENDPOINT+'?cfg=1&k='+encodeURIComponent(KEYV))).json();
    if(c.ok)CFG={objects:c.objects||[],workers:c.workers||[]};else if(c.error==='key')toast('Ключ офиса не подходит — попросите новую ссылку')}catch(e){}}
  try{localStorage.setItem(CKEY,JSON.stringify(CFG))}catch(e){}
  if(view!=='edit')render(); retryPending();
}
const sig=a=>JSON.stringify([a.object,a.kv,a.date,a.workers,a.note,a.windows.map(w=>[w.type,w.ok,w.size,w.panes,(w.photos||[]).length]),a.rest.map(r=>[r.kind,r.item,r.num,r.ok,r.qty,(r.photos||[]).length])]);
const b64=blob=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.readAsDataURL(blob)});
async function syncActs(acts,pdfBlob,name){
  if(!ENDPOINT||!KEYV)return false;
  const payload={k:KEYV,acts:acts.map(a=>{const t=totals(a);return {id:a.id,object:a.object,kv:a.kv,date:a.date,workers:a.workers||[],note:a.note||'',
    totals:{m2:Math.round(t.m2*100)/100,sp:t.sp,def:t.def},rows:dataRows([a])}}),pdf:pdfBlob?{name:name,b64:await b64(pdfBlob)}:null};
  try{const j=await (await fetch(ENDPOINT,{method:'POST',body:JSON.stringify(payload)})).json();
    if(j.ok){acts.forEach(a=>{a.sentSig=sig(a);a.pending=false;a.sentAt=Date.now()});save();return true}
    if(j.error==='key')toast('Ключ офиса не подходит — попросите новую ссылку');
  }catch(e){}
  acts.forEach(a=>{a.pending=true});save();return false;
}
let retrying=false;
async function retryPending(){
  if(retrying||!ENDPOINT||!KEYV||!navigator.onLine)return;retrying=true;let n=0;
  try{for(const a of DB.acts.filter(a=>a.pending)){const pg=await drawActs([a]);if(await syncActs([a],makePDF(pg),fname([a],'pdf')))n++}}finally{retrying=false}
  if(n){toast('Отправлено в офис актов: '+n);if(view==='list')renderList()}
}
window.addEventListener('online',retryPending);
function syncBadge(a){if(a.sentSig&&a.sentSig===sig(a))return ' · <span style="color:var(--ok)">✓ в офисе</span>';
  if(a.sentSig)return ' · <span style="color:var(--bad)">изменён — сформируйте акт заново</span>';
  if(a.pending)return ' · <span style="color:var(--bad)">ждёт интернета</span>';return ''}
// фото — IndexedDB
let idb=null;
function idbOpen(){return idb||(idb=new Promise((res,rej)=>{const r=indexedDB.open('akt-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function phPut(id,blob){const d=await idbOpen();return new Promise((res,rej)=>{const t=d.transaction('ph','readwrite');t.objectStore('ph').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function phGet(id){const d=await idbOpen();return new Promise(res=>{const r=d.transaction('ph').objectStore('ph').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)})}
async function phDel(id){const d=await idbOpen();return new Promise(res=>{const t=d.transaction('ph','readwrite');t.objectStore('ph').delete(id);t.oncomplete=res;t.onerror=res})}
const urlCache={};
async function phURL(id){if(urlCache[id])return urlCache[id];const b=await phGet(id);if(!b)return '';return urlCache[id]=URL.createObjectURL(b)}
async function compress(file){
  const bmp=await createImageBitmap(file).catch(()=>null); let w,h,src;
  if(bmp){w=bmp.width;h=bmp.height;src=bmp}else{src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});w=src.naturalWidth;h=src.naturalHeight}
  const k=Math.min(1,1400/Math.max(w,h)); const c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height); return new Promise(r=>c.toBlob(r,'image/jpeg',0.72));
}
function itemPhotos(a){const l=[];a.windows.forEach(w=>(w.photos||[]).forEach(p=>l.push(p.id)));a.rest.forEach(r=>(r.photos||[]).forEach(p=>l.push(p.id)));return l}

/* ===== утилиты ===== */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtDate=s=>s?s.split('-').reverse().join('.'):'';
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:0};
const fmtN=x=>(Math.round(x*100)/100).toString().replace('.',',');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const $=s=>document.querySelector(s), app=$('#app');
const objAddr=name=>{const o=CFG.objects.find(o=>o.name===name);return o?o.address||'':''};
function winLabel(w){return w.type==='ОК'?('ОК-'+(w.ok||'?')):w.type}
function itemLabel(r){const ab=ABBR[r.item];let s=r.item;if(r.num)s+=ab?(' '+ab+'-'+r.num):(' №'+r.num);else if(ab)s+=' ('+ab+')';return s}
const kindOf=c=>KINDS.find(k=>k.code===c)||{short:'?'};
function totals(list){let m2=0,sp=0,warn=0,def=0;(Array.isArray(list)?list:[list]).forEach(a=>{
  a.windows.forEach(w=>w.panes.forEach(p=>{const v=num(p.m2);if(p.mark&&p.mark!=='×'){sp++;if(!v)warn++}m2+=v}));a.rest.forEach(r=>def+=num(r.qty))});return {m2,sp,warn,def}}
const actDates=acts=>[...new Set(acts.map(a=>a.date))].sort();
const dspan=acts=>{const d=actDates(acts);return d.length>1?fmtDate(d[0])+' – '+fmtDate(d[d.length-1]):fmtDate(d[0])};
function workersStr(a){return (a.workers||[]).join(', ')}

/* ===== навигация ===== */
let view='list', cur=null, prevActs=null;
function render(){
  const titles={list:'Акты по квартирам',edit:'Кв. '+(cur&&cur.kv||'…'),settings:'Кто я',preview:'Готовый акт',office:'Перенос в заявку',menu:'Меню'};
  $('#ttl').textContent=titles[view]||'';
  $('#hdrBtn').textContent=view==='list'?'Меню':'← Назад';
  ({list:renderList,edit:renderEdit,settings:renderSettings,preview:renderPreview,office:renderOffice,menu:renderMenu})[view]();
}
$('#hdrBtn').onclick=()=>{ if(view==='list')view='menu'; else if(view==='preview')view=prevActs&&prevActs.length===1&&cur?'edit':'list'; else {save();view='list'} render();scrollTo(0,0)};
function go(v){view=v;render();scrollTo(0,0)}
function bar(html){$('#barIn').innerHTML=html}

function renderMenu(){
  app.innerHTML=`<div class="card"><button class="btn sec" id="mMe">Кто я (выбрать себя)</button><div style="height:8px"></div>
   <button class="btn sec" id="mOff">Перенос в заявку (для офиса)</button><div style="height:8px"></div>
   <button class="btn sec" id="mCfg">Обновить списки объектов и работников</button></div>
   <div class="card"><h2>Офис</h2><div class="hint">${KEYV&&ENDPOINT?'Подключено: сформированные акты сами уходят в журнал офиса и в заявку.':'Не подключено. Откройте ссылку, которую прислал офис.'}</div></div>
   <div class="card"><h2>Память телефона</h2><div class="hint">Акты и фото хранятся только на этом телефоне.</div>
   <div style="margin-top:8px"><button class="btn sec" id="mOld">Удалить акты старше 30 дней</button></div></div>`;
  $('#mMe').onclick=()=>go('settings'); $('#mOff').onclick=()=>go('office');
  $('#mCfg').onclick=async()=>{await loadCfg();toast('Объектов: '+CFG.objects.length+', работников: '+CFG.workers.length)};
  $('#mOld').onclick=async()=>{const lim=Date.now()-30*864e5;const old=DB.acts.filter(a=>a.created<lim);for(const a of old)for(const id of itemPhotos(a))await phDel(id);DB.acts=DB.acts.filter(a=>a.created>=lim);save();toast('Удалено актов: '+old.length)};
  bar('');
}

function renderSettings(){
  const s=DB.settings;
  app.innerHTML=`<div class="card"><h2>Кто работает</h2>
   ${CFG.workers.length?`<div class="chips">${CFG.workers.map(w=>`<button class="chip ${s.me.includes(w)?'on':''}" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>
   <div class="hint">Отметьте себя (и напарника, если работаете вместе). Это подставится в новые акты.</div>`
   :`<div class="warn">Список работников ещё не задан. Нажмите «Меню → Обновить списки».</div>`}</div>
   <div class="card"><h2>Объект по умолчанию</h2>${objSelect(s.object,'sObj')}</div>`;
  app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const w=b.dataset.w;s.me=s.me.includes(w)?s.me.filter(x=>x!==w):[...s.me,w];save();renderSettings()});
  const so=$('#sObj'); if(so) so.onchange=()=>{s.object=so.value;save()};
  bar(`<button class="btn" id="bDone">Готово</button>`); $('#bDone').onclick=()=>go('list');
}
function objSelect(val,id){
  if(!CFG.objects.length) return `<div class="warn">Список объектов ещё не задан. Нажмите «Меню → Обновить списки».</div>`;
  return `<select id="${id}"><option value="">— выберите объект —</option>${CFG.objects.map(o=>`<option ${o.name===val?'selected':''} value="${esc(o.name)}">${esc(o.name)}</option>`).join('')}</select>${val?`<div class="hint">${esc(objAddr(val))}</div>`:''}`;
}

const iso=x=>{const d=new Date(x);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const PERS=[['all','Всё'],['today','Сегодня'],['week','Эта неделя'],['pweek','Прошлая неделя'],['month','Этот месяц'],['custom','Период…']];
function periodRange(f){const t=today(),d=new Date(t+'T00:00:00'),wd=(d.getDay()+6)%7,sh=n=>{const x=new Date(d);x.setDate(x.getDate()+n);return iso(x)};
  switch(f.per){case 'today':return [t,t];case 'week':return [sh(-wd),t];case 'pweek':return [sh(-wd-7),sh(-wd-1)];case 'month':return [t.slice(0,8)+'01',t];case 'custom':return [f.from||'',f.to||''];default:return ['','']}}
function renderList(){
  const f=DB.settings.flt=Object.assign({obj:'',wk:'',per:'all',from:'',to:''},DB.settings.flt||{});
  const [from,to]=periodRange(f);
  const objsAll=[...new Set([...CFG.objects.map(o=>o.name),...DB.acts.map(a=>a.object).filter(Boolean)])];
  const wksAll=[...new Set([...CFG.workers,...DB.acts.flatMap(a=>a.workers||[])])];
  const F=DB.acts.filter(a=>(!f.obj||a.object===f.obj)&&(!f.wk||(a.workers||[]).includes(f.wk))&&(!from||a.date>=from)&&(!to||a.date<=to));
  const by={}; F.forEach(a=>{(by[a.date]=by[a.date]||[]).push(a)});
  const days=Object.keys(by).sort().reverse();
  const T=totals(F),fOn=f.obj||f.wk||f.per!=='all',nObj=new Set(F.map(a=>a.object)).size,nDay=days.length;
  app.innerHTML=`${!KEYV?'<div class="warn">Офис не подключён: откройте ссылку, которую прислал офис.</div>':''}${!DB.settings.me.length?'<div class="warn">Сначала выберите себя: «Меню → Кто я».</div>':''}
   ${DB.acts.length?`<div class="card"><div class="row" style="flex-wrap:wrap"><select id="lObj" style="flex-basis:100%"><option value="">Все объекты</option>${objsAll.map(o=>`<option ${o===f.obj?'selected':''} value="${esc(o)}">${esc(o)}</option>`).join('')}</select>
    <select id="lWk" style="flex-basis:100%"><option value="">Все работники</option>${wksAll.map(w=>`<option ${w===f.wk?'selected':''} value="${esc(w)}">${esc(w)}</option>`).join('')}</select></div>

/* ===== отрисовка акта (A4, 150 dpi) ===== */
const PW=1240,PH=1754,MG=64;
async function loadImgs(acts){const m={};for(const a of acts)for(const id of itemPhotos(a)){const b=await phGet(id);if(b){try{m[id]=await createImageBitmap(b)}catch(e){m[id]=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=URL.createObjectURL(b)})}}}return m}
async function drawActs(acts){
  const imgs=await loadImgs(acts);const pages=[];let g,y;const multi=acts.length>1;const span=actDates(acts).length>1,dstr=dspan(acts);
  const objs=[...new Set(acts.map(a=>a.object))], wks=[...new Set(acts.flatMap(a=>a.workers||[]))];
  const font=(px,w=400,col='#000')=>{g.font=`${w} ${px}px Roboto, Arial, sans-serif`;g.fillStyle=col};
  const newPage=()=>{const c=document.createElement('canvas');c.width=PW;c.height=PH;g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,PW,PH);pages.push(c);y=MG;
    if(pages.length>1){font(19,400,'#666');g.fillText((multi?(span?'Сводный акт за ':'Акт за ')+dstr:'Кв. '+acts[0].kv+' · '+fmtDate(acts[0].date))+' (продолжение)',MG,y);y+=34}};
  const need=h=>{if(y+h>PH-MG-30)newPage()};
  const text=(s,x,yy,px,w,col,al)=>{font(px,w,col);g.textAlign=al||'left';g.fillText(s,x,yy);g.textAlign='left'};
  const wrap=(s,x,maxW,lh)=>{let line='';for(const w of String(s).split(/\s+/)){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){need(lh);g.fillText(line,x,y);y+=lh;line=w}else line=t}if(line){need(lh);g.fillText(line,x,y);y+=lh}};
  const fit=(s,maxW)=>{s=String(s);while(g.measureText(s).width>maxW&&s.length>1)s=s.slice(0,-1);return s};
  newPage();
  text(span?'СВОДНЫЙ АКТ ВЫПОЛНЕННЫХ РАБОТ ЗА ПЕРИОД':multi?'АКТ ВЫПОЛНЕННЫХ РАБОТ ЗА ДЕНЬ':'АКТ ВЫПОЛНЕННЫХ РАБОТ ПО КВАРТИРЕ',PW/2,y+22,34,700,'#000','center');y+=56;
  text('внутренний документ',PW/2,y,19,400,'#666','center');y+=40;
  const info=[['Объект',objs.map(o=>o+(objAddr(o)?', '+objAddr(o):'')).join('; ')],[multi?'Квартиры':'Квартира / помещение',[...new Set(acts.map(a=>a.kv))].join(', ')],
    [span?'Период':'Дата',dstr+(!multi&&(acts[0].keysIn||acts[0].keysOut)?`     ключи: получены ${acts[0].keysIn||'—'}, сданы ${acts[0].keysOut||'—'}`:'')],['Исполнители',wks.join(', ')||'—']];
  for(const [k,v] of info){font(23,700);g.fillText(k+':',MG,y);const kw=g.measureText(k+': ').width;font(23);wrap(v||'—',MG+kw,PW-2*MG-kw,31);y+=3}
  y+=8;
  if(multi){ // сводка по квартирам
    const cw=span?[170,220,250,200,272]:[300,300,300,212],hd=(span?['Дата']:[]).concat(['Квартира','Шлифовка, м²','СП','Реставрация, деф.']),rh=40;
    const row=(v,b,f)=>{need(rh);let x=MG;if(f){g.fillStyle='#eef1f5';g.fillRect(MG,y,cw.reduce((a,b)=>a+b),rh)}v.forEach((s,k)=>{g.strokeStyle='#000';g.lineWidth=1.5;g.strokeRect(x,y,cw[k],rh);font(20,b?700:400);g.fillText(fit(s,cw[k]-14),x+8,y+27);x+=cw[k]});y+=rh};
    row(hd,true,true);acts.forEach(a=>{const t=totals(a);row((span?[fmtDate(a.date)]:[]).concat(['Кв. '+a.kv,fmtN(t.m2),t.sp,t.def]))});const T=totals(acts);row((span?['ИТОГО','']:['ИТОГО']).concat([fmtN(T.m2),T.sp,T.def]),true,true);y+=26;
  }
  const photoBlock=(list,x,w)=>{ // возвращает высоту и рисует
    const ph=list.map(p=>({p,im:imgs[p.id]})).filter(o=>o.im).sort((a,b)=>(a.p.tag==='до'?0:1)-(b.p.tag==='до'?0:1));
    if(!ph.length)return 0;const cols=2,gap=14,cw=(w-gap)/cols,maxH=300;let yy=0,i=0;const startY=y;
    while(i<ph.length){const rowItems=ph.slice(i,i+cols);const hs=rowItems.map(o=>Math.min(maxH,cw*o.im.height/o.im.width));const rh=Math.max(...hs)+30;
      rowItems.forEach((o,k)=>{const iw=Math.min(cw,maxH*o.im.width/o.im.height),ih=iw*o.im.height/o.im.width,xx=x+k*(cw+gap);
        font(18,700,o.p.tag==='до'?'#b42318':'#1d7a3e');g.fillText(o.p.tag.toUpperCase(),xx,startY+yy+18);g.drawImage(o.im,xx,startY+yy+26,iw,ih);g.strokeStyle='#999';g.lineWidth=1;g.strokeRect(xx,startY+yy+26,iw,ih)});
      yy+=rh+gap;i+=cols}
    return yy;
  };
  const photoH=(list,w)=>{const ph=list.map(p=>imgs[p.id]).filter(Boolean);if(!ph.length)return 0;const cw=(w-14)/2;let h=0;for(let i=0;i<ph.length;i+=2){h+=Math.max(...ph.slice(i,i+2).map(im=>Math.min(300,cw*im.height/im.width)))+30+14}return h};
  const winBox=(w,x,yy,bw,draw=true)=>{ // схема окна
    const n=w.panes.length,per=n<=4?n:Math.ceil(n/2),rows=Math.ceil(n/per),ph=100,bh=56+rows*ph+(w.size?28:0)+34;if(!draw)return bh;
    g.strokeStyle='#000';g.lineWidth=2;g.strokeRect(x,yy,bw,bh);text(winLabel(w),x+12,yy+31,23,700);text(n+' СП',x+bw-12,yy+31,18,400,'#555','right');
    const fx=x+12,fy=yy+44,fw=bw-24,fh=rows*ph,pw=fw/per;g.lineWidth=4;g.strokeRect(fx,fy,fw,fh);g.lineWidth=2;let wm=0;
    w.panes.forEach((p,j)=>{const r=Math.floor(j/per),c=j%per,px=fx+c*pw,py=fy+r*ph;g.strokeRect(px+4,py+4,pw-8,ph-8);text(String(j+1),px+10,py+23,16,400,'#555');
      if(p.mark)text(p.mark,px+pw/2,py+64,46,700,p.mark==='×'?'#444':'#000','center');if(num(p.m2)){text(fmtN(num(p.m2))+' м²',px+pw/2,py+ph-12,17,600,'#000','center');wm+=num(p.m2)}});
    let by=fy+fh+25;if(w.size){text('Размер: '+w.size,x+12,by,17,400,'#444');by+=28}text('Итого: '+fmtN(wm)+' м²',x+12,by,18,600);return bh};
  for(const a of acts){
    const t=totals(a);
    if(multi){need(70);g.fillStyle='#1f4e79';g.fillRect(MG,y,PW-2*MG,44);text('Кв. '+a.kv+(span?' · '+fmtDate(a.date):'')+(objs.length>1?' · '+a.object:''),MG+14,y+30,24,700,'#fff');
      text(`${fmtN(t.m2)} м² · ${t.def} деф.`,PW-MG-14,y+30,20,400,'#fff','right');y+=60}
    if(a.windows.length){
      need(80);text('Шлифовка стеклопакетов',MG,y+8,26,700);text(`итого ${fmtN(t.m2)} м², ${t.sp} СП`,PW-MG,y+8,20,400,'#444','right');y+=22;
      text('+ снаружи   − изнутри   ± с двух сторон   × не устраняется (брак / трещина)',MG,y+20,18,400,'#444');y+=38;
      const plain=a.windows.filter(w=>!(w.photos||[]).length),withPh=a.windows.filter(w=>(w.photos||[]).length);
      const cols=3,gap=22,bw=(PW-2*MG-gap*(cols-1))/cols;
      for(let i=0;i<plain.length;i+=cols){const grp=plain.slice(i,i+cols);const h=Math.max(...grp.map(w=>winBox(w,0,0,bw,false)));need(h);grp.forEach((w,k)=>winBox(w,MG+k*(bw+gap),y,bw));y+=h+gap}
      for(const w of withPh){const bh=winBox(w,0,0,bw,false),pw=PW-2*MG-bw-gap,ph=photoH(w.photos,pw);need(Math.min(Math.max(bh,ph),PH-2*MG-60));
        const y0=y;winBox(w,MG,y0,bw);const used=photoBlock(w.photos,MG+bw+gap,pw);y=y0+Math.max(bh,used)+gap}
    }
    if(a.rest.length){
      need(100);text('Реставрация',MG,y+8,26,700);text(`итого ${t.def} деф.`,PW-MG,y+8,20,400,'#444','right');y+=24;
      const cw=[56,190,520,170,176],hd=['№','Вид','Предмет','Где','Деф.'],rh=42;
      const row=(v,b,f)=>{need(rh);let x=MG;if(f){g.fillStyle='#eef1f5';g.fillRect(MG,y,cw.reduce((a,b)=>a+b),rh)}v.forEach((s,k)=>{g.strokeStyle='#000';g.lineWidth=1.5;g.strokeRect(x,y,cw[k],rh);font(19,b?700:400);g.fillText(fit(s,cw[k]-14),x+8,y+28);x+=cw[k]});y+=rh};
      row(hd,true,true);a.rest.forEach((r,i)=>row([i+1,kindOf(r.kind).short,itemLabel(r),r.ok?'ОК-'+r.ok:'',r.qty+((r.photos||[]).length?'  · фото':'')]));y+=18;
      for(const [i,r] of a.rest.entries()){if(!(r.photos||[]).length)continue;const pw=PW-2*MG,ph=photoH(r.photos,pw);need(Math.min(ph+40,PH-2*MG-60));
        text(`${i+1}. ${kindOf(r.kind).short} · ${itemLabel(r)}${r.ok?' · ОК-'+r.ok:''}`,MG,y+20,20,700);y+=30;y+=photoBlock(r.photos,MG,pw)}
      y+=6;
    }
    if(a.note){need(60);text('Примечание:',MG,y+10,22,700);y+=38;font(21);wrap(a.note,MG,PW-2*MG,29);y+=8}
    if(multi)y+=10;
  }
  const T=totals(acts);need(200);g.strokeStyle='#000';g.lineWidth=2;g.strokeRect(MG,y,PW-2*MG,86);
  text(span?'Итого за период:':multi?'Итого за день:':'Итого по квартире:',MG+16,y+36,23,700);text(`шлифовка ${fmtN(T.m2)} м² (${T.sp} СП)     реставрация ${T.def} деф.`,MG+250,y+36,23);
  text('Исполнители: '+(wks.join(', ')||'—'),MG+16,y+70,19,400,'#333');y+=116;
  font(20);wrap('Места выполнения работ и объём подтверждаются прорабом ответом на это сообщение в чате объекта.',MG,PW-2*MG,28);
  const stamp='Сформировано '+new Date().toLocaleString('ru-RU');
  pages.forEach((p,i)=>{const q=p.getContext('2d');q.font='400 16px Arial';q.fillStyle='#777';q.textAlign='left';q.fillText(stamp,MG,PH-MG+14);q.textAlign='right';if(pages.length>1)q.fillText('лист '+(i+1)+' из '+pages.length,PW-MG,PH-MG+14)});
  return pages;
}

/* ===== PDF без библиотек ===== */
function dataURLtoBytes(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function makePDF(cvs){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const n=cvs.length,W=595.28,H=841.89;push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const obj=(id,body)=>{offs[id]=len;push(id+' 0 obj\n');body();push('\nendobj\n')};
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));const kids=[];for(let i=0;i<n;i++)kids.push((3+i*3)+' 0 R');
  obj(2,()=>push(`<< /Type /Pages /Count ${n} /Kids [${kids.join(' ')}] >>`));
  cvs.forEach((cv,i)=>{const pid=3+i*3,cid=pid+1,iid=pid+2,jpg=dataURLtoBytes(cv.toDataURL('image/jpeg',0.85));
    obj(pid,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;obj(cid,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(iid,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push('\nendstream')})});
  const total=3+n*3,xref=len;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(parts,{type:'application/pdf'});
}

/* ===== текстовый отчёт + строки для заявки ===== */
function dataRows(acts){const out=[];acts.forEach(a=>{
  a.windows.forEach(w=>w.panes.forEach((p,j)=>{if(!p.mark||p.mark==='×'||!num(p.m2))return;out.push([a.kv,'шлиф',w.type==='ОК'?w.ok:w.type,j+1,'',w.size||'',fmtN(num(p.m2))])}));
  a.rest.forEach(r=>out.push([a.kv,r.kind,r.ok||'','',r.item+(r.num?' '+r.num:''),'',r.qty]))});return out}
function textReport(acts){
  const T=totals(acts),objs=[...new Set(acts.map(a=>a.object))],wks=[...new Set(acts.flatMap(a=>a.workers||[]))];
  const sp=actDates(acts).length>1;let s=`${sp?'Сводный акт за ':acts.length>1?'Акт за день ':'Акт '}${dspan(acts)} — ${objs.join('; ')}\nИсполнители: ${wks.join(', ')||'—'}\n`;
  acts.forEach(a=>{const t=totals(a);const ws=a.windows.map(w=>{const p=w.panes.map((p,j)=>p.mark&&p.mark!=='×'?`${j+1}СП${p.mark}${num(p.m2)?' '+fmtN(num(p.m2)):''}`:'').filter(Boolean);return p.length?winLabel(w)+': '+p.join(', '):''}).filter(Boolean);
    const rs=a.rest.map(r=>`${kindOf(r.kind).short} ${itemLabel(r)}${r.ok?' ОК-'+r.ok:''} — ${r.qty}`);
    s+=`\n${sp?fmtDate(a.date)+' ':''}Кв. ${a.kv}: шлифовка ${fmtN(t.m2)} м²${ws.length?' ('+ws.join('; ')+')':''}${rs.length?'; реставрация '+t.def+' деф. ('+rs.join('; ')+')':''}${a.note?'. Прим.: '+a.note:''}`});
  s+=`\n\nИтого: шлифовка ${fmtN(T.m2)} м² (${T.sp} СП), реставрация ${T.def} деф.\n\nДля заявки:\n`+dataRows(acts).map(r=>r.join(';')).join('\n');
  return s;
}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}

/* ===== экран готового акта ===== */
let lastPages=[];
const fname=(acts,ext)=>(acts.length>1?`${actDates(acts).length>1?'Сводный акт':'Акт за день'} ${dspan(acts)}`:`Акт кв ${String(acts[0].kv).replace(/[\\/:*?"<>|]/g,'-')} ${fmtDate(acts[0].date)}`)+'.'+ext;
async function renderPreview(){
  const acts=prevActs;app.innerHTML='<div class="card muted">Собираю акт…</div>';bar('');
  lastPages=await drawActs(acts);const t=totals(acts);
  app.innerHTML=`${t.warn?`<div class="warn">У ${t.warn} отмеченных СП нет площади — они не попадут в строки для заявки.</div>`:''}
   <div class="card prev">${lastPages.map(p=>`<img src="${p.toDataURL('image/jpeg',0.8)}" alt="лист акта">`).join('')}</div>
   <div class="card"><div id="syncSt" class="hint" style="margin:0 0 10px;font-size:14px"></div><h2>Отправить в чат</h2>
    <button class="btn" id="shPdf">Отправить PDF</button><div style="height:8px"></div>
    <button class="btn sec" id="shImg">Отправить картинками</button><div style="height:8px"></div>
    <button class="btn sec" id="shTxt">Отправить отчёт текстом</button>
    <div class="hint">Откроется меню «Поделиться» — выберите МАКС или ВКонтакте и чат объекта. Текстовый отчёт содержит блок «Для заявки» — офис переносит его в заявку за один раз.</div></div>`;
  {const st=$('#syncSt'),need=acts.filter(a=>a.sentSig!==sig(a));
   if(!KEYV||!ENDPOINT)st.textContent='Офис не подключён — акт не попадёт в журнал. Откройте ссылку от офиса.';
   else if(!need.length)st.textContent='✓ Уже в журнале офиса';
   else{st.textContent='Отправляю в журнал офиса…';syncActs(acts,makePDF(lastPages),fname(acts,'pdf')).then(ok=>{const e=$('#syncSt');if(e)e.textContent=ok?'✓ Отправлено в журнал офиса':'Нет интернета — акт отправится в офис сам, когда связь появится'})}}
  $('#shPdf').onclick=()=>share([new File([makePDF(lastPages)],fname(acts,'pdf'),{type:'application/pdf'})],acts);
  $('#shImg').onclick=async()=>{const files=[];for(let i=0;i<lastPages.length;i++){const b=await new Promise(r=>lastPages[i].toBlob(r,'image/jpeg',0.85));files.push(new File([b],fname(acts,'jpg').replace('.jpg',lastPages.length>1?` л${i+1}.jpg`:'.jpg'),{type:'image/jpeg'}))}share(files,acts)};
  $('#shTxt').onclick=async()=>{const t=textReport(acts);if(navigator.share){try{await navigator.share({text:t});return}catch(e){if(e.name==='AbortError')return}}if(await copyText(t))toast('Отчёт скопирован — вставьте в чат');else prompt('Скопируйте отчёт:',t)};
  bar(acts.length===1?`<button class="btn sec" id="bEdit">Исправить</button><button class="btn" id="bList">К списку</button>`:`<button class="btn" id="bList">К списку</button>`);
  const be=$('#bEdit');if(be)be.onclick=()=>{cur=acts[0];go('edit')};$('#bList').onclick=()=>go('list');
}
async function share(files,acts){
  const text=acts.length>1?`${actDates(acts).length>1?'Сводный акт':'Акт'} за ${dspan(acts)} (${acts[0].object}), кв. ${[...new Set(acts.map(a=>a.kv))].join(', ')}. Прошу подтвердить ответом.`:`Акт кв. ${acts[0].kv} от ${fmtDate(acts[0].date)} (${acts[0].object}). Прошу подтвердить ответом.`;
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,text});return}}catch(e){if(e&&e.name==='AbortError')return}
  files.forEach(f=>{const u=URL.createObjectURL(f);const l=document.createElement('a');l.href=u;l.download=f.name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)});
  toast('Файл сохранён — прикрепите его в чат');
}

/* ===== офис: перенос в заявку ===== */
function parseRows(t){return t.split(/\r?\n/).map(l=>l.trim()).filter(l=>(l.match(/;/g)||[]).length===6).map(l=>l.split(';'))}
function renderOffice(){
  app.innerHTML=`<div class="card"><h2>Перенос в заявку</h2>
   <div class="hint" style="margin:0 0 8px">Скопируйте из МАКС или ВКонтакте один или несколько текстовых отчётов целиком и вставьте сюда. Строки «Для заявки» найдутся сами.</div>
   <textarea id="oIn" style="min-height:160px" placeholder="Вставьте отчёты сюда"></textarea>
   <div id="oRes"></div></div>`;
  const upd=()=>{const R=parseRows($('#oIn').value);$('#oRes').innerHTML=R.length?`<div class="hint">Найдено строк: <b>${R.length}</b></div>
    <div style="overflow:auto;margin:8px 0"><table class="imp"><tr><th>Кв.</th><th>Вид</th><th>ОК</th><th>СП</th><th>Предмет</th><th>Размер</th><th>Кол-во</th></tr>${R.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>
    <button class="btn" id="oCp">Скопировать для Excel</button><div class="hint">В Excel встаньте в первую свободную строку колонки A листа ввода и нажмите Ctrl+V.</div>`:'<div class="hint">Строк для заявки пока не найдено.</div>';
    const b=$('#oCp');if(b)b.onclick=async()=>{const ok=await copyText(R.map(r=>r.join('\t')).join('\n'));toast(ok?'Скопировано: '+R.length+' строк':'Не удалось скопировать')}};
  $('#oIn').oninput=upd;upd();bar('');
}

render();loadCfg();
